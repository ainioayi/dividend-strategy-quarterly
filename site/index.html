<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="月度高息动量 V1 前向模拟盘公开业绩：每日收益曲线、510300 基准、持仓和交易明细。">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>V1 公开业绩</title>
  <style>
    :root {
      --paper: #f4f4ef;
      --surface: #fff;
      --ink: #151815;
      --muted: #666c66;
      --line: #cfd2ca;
      --red: #ee3022;
      --green: #00875f;
      --amber: #a86200;
      --lime: #d9ff38;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --serif: "Songti SC", SimSun, serif;
      --sans: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); letter-spacing: 0; }
    button, input { font: inherit; }
    a { color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--mono); }
    .positive { color: var(--red) !important; }
    .negative { color: var(--green) !important; }
    .muted { color: var(--muted); }

    .loading-screen, .error-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .loading-box, .error-box { width: min(560px, 100%); border: 1px solid var(--ink); background: var(--surface); padding: 28px; }
    .loading-box strong, .error-box h1 { display: block; margin: 0 0 10px; font-family: var(--serif); font-size: 28px; }
    .loading-line { width: 100%; height: 4px; margin-top: 20px; overflow: hidden; background: var(--line); }
    .loading-line::after { content: ""; display: block; width: 36%; height: 100%; background: var(--red); animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
    .retry-button { min-height: 40px; margin-top: 18px; padding: 0 18px; border: 1px solid var(--ink); color: #fff; background: var(--ink); cursor: pointer; font-weight: 700; }
    .retry-button:focus-visible, .range-control button:focus-visible, .nav-links a:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

    .page { min-height: 100vh; padding-bottom: 40px; }
    .shell { width: min(1390px, calc(100% - 48px)); margin: 0 auto; }
    .site-header { border-bottom: 1px solid var(--ink); background: rgba(244, 244, 239, .97); }
    .header-row { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: baseline; gap: 15px; text-decoration: none; }
    .brand strong { font-family: var(--serif); font-size: 24px; font-weight: 700; }
    .brand span { font-family: var(--mono); font-size: 10px; font-weight: 700; }
    .nav-links { display: flex; align-items: center; gap: 22px; font-size: 12px; font-weight: 700; }
    .nav-links a { text-decoration: none; }
    .nav-links a:hover { color: var(--red); }
    .asof { text-align: right; font-size: 10px; color: var(--muted); }
    .asof strong { display: block; margin-top: 2px; color: var(--ink); font-family: var(--mono); font-size: 12px; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 24px 0 14px;
      padding: 11px 14px;
      border: 1px solid var(--ink);
      background: #efffc7;
      font-size: 11px;
    }
    .status-bar strong { font-family: var(--mono); }
    .status-copy { color: #394039; }

    .score { display: grid; grid-template-columns: 1.2fr 2fr; border: 1px solid var(--ink); background: var(--surface); }
    .score-primary { min-height: 255px; padding: 30px; border-right: 1px solid var(--ink); display: flex; flex-direction: column; justify-content: space-between; }
    .eyebrow { margin-bottom: 12px; font-family: var(--mono); font-size: 10px; font-weight: 700; }
    .score-primary h1 { margin: 0; font-family: var(--serif); font-size: clamp(36px, 5vw, 64px); line-height: 1.05; font-weight: 700; }
    .hero-return { margin-top: 20px; font-family: var(--serif); font-size: clamp(52px, 7vw, 92px); line-height: .94; }
    .score-primary small { display: block; margin-top: 12px; color: var(--muted); }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .metric { min-height: 127px; padding: 30px; border-bottom: 1px solid var(--line); }
    .metric:nth-child(odd) { border-right: 1px solid var(--line); }
    .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    .metric span { display: block; margin-bottom: 10px; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; font-family: var(--serif); font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; }

    .section { padding: 42px 0 0; scroll-margin-top: 20px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 14px; }
    .section-title { display: flex; align-items: end; gap: 14px; }
    .section-title span { padding-bottom: 7px; font-family: var(--mono); font-size: 10px; font-weight: 700; }
    .section-title h2 { margin: 0; font-family: var(--serif); font-size: clamp(32px, 4vw, 50px); line-height: 1; }
    .hint { max-width: 600px; color: var(--muted); font-size: 11px; text-align: right; }

    .range-control { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--ink); background: var(--surface); }
    .range-control button { min-width: 64px; height: 38px; padding: 0 12px; border: 0; border-right: 1px solid var(--ink); background: transparent; cursor: pointer; font-size: 11px; font-weight: 700; }
    .range-control button:last-child { border-right: 0; }
    .range-control button.active { color: #fff; background: var(--ink); }

    .chart-shell { position: relative; overflow: hidden; border: 1px solid var(--ink); background: var(--surface); }
    .chart-topline { min-height: 52px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
    .legend { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; font-size: 11px; font-weight: 700; }
    .legend-item { display: flex; align-items: center; gap: 9px; }
    .legend-mark { width: 18px; height: 3px; background: var(--red); }
    .legend-mark.benchmark { height: 2px; background: repeating-linear-gradient(90deg, #4a504a 0 6px, transparent 6px 10px); }
    .chart-latest { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .chart-scroll { min-height: 410px; overflow-x: auto; overflow-y: hidden; }
    .performance-chart { display: block; width: 100%; min-width: 820px; height: auto; }
    .chart-tooltip { position: absolute; z-index: 3; top: 68px; width: 188px; padding: 10px 12px; border: 1px solid var(--ink); background: rgba(21, 24, 21, .94); color: #fff; pointer-events: none; opacity: 0; transform: translateX(-50%); font-size: 11px; }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip strong { display: block; margin-bottom: 7px; font-family: var(--mono); }
    .tooltip-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
    .tooltip-row .strategy { color: #ff6b5f; }
    .tooltip-row .benchmark { color: var(--lime); }
    .chart-foot { min-height: 44px; padding: 0 18px; display: flex; align-items: center; gap: 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }

    .summary-strip { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--ink); border-top: 0; background: var(--surface); }
    .summary-item { min-height: 70px; padding: 14px 17px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-item span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; }
    .summary-item strong { font-size: 15px; }

    .holding-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .holding-item { min-height: 146px; padding: 20px; border: 1px solid var(--ink); background: var(--surface); }
    .holding-head { display: flex; justify-content: space-between; gap: 18px; }
    .holding-head h3 { margin: 0; font-family: var(--serif); font-size: 22px; }
    .holding-code { margin-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .holding-pnl { font-size: 17px; font-weight: 800; text-align: right; }
    .holding-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
    .holding-stats span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; }
    .holding-stats strong { display: block; font-size: 13px; }
    .empty-holding { grid-column: 1 / -1; min-height: 130px; display: flex; flex-direction: column; justify-content: center; }
    .empty-holding h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 24px; }
    .empty-holding p { margin: 0; }

    .trade-wrap { overflow-x: auto; border: 1px solid var(--ink); background: var(--surface); }
    .trade-table { width: 100%; min-width: 1100px; border-collapse: collapse; font-size: 11px; }
    .trade-table th { padding: 13px 12px; background: #e9e9e2; border-bottom: 1px solid var(--ink); color: #404640; font-size: 10px; text-align: left; white-space: nowrap; }
    .trade-table td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .trade-table tbody tr:last-child td { border-bottom: 0; }
    .trade-table .right { text-align: right; }
    .stock-name { display: block; font-weight: 700; }
    .stock-code { display: block; margin-top: 3px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .side { display: inline-flex; min-width: 42px; height: 24px; align-items: center; justify-content: center; border: 1px solid currentColor; font-weight: 700; }
    .side-buy { color: var(--red); }
    .side-sell { color: var(--green); }
    .side-dividend { color: var(--amber); }
    .empty-row { padding: 42px !important; color: var(--muted); text-align: center !important; }

    .method-band { margin-top: 48px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: #e7e9e1; }
    .method-inner { display: grid; grid-template-columns: .85fr 2fr; gap: 40px; padding: 30px 0; }
    .method-inner h2 { margin: 0; font-family: var(--serif); font-size: 30px; }
    .method-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 30px; }
    .method-grid div { min-width: 0; }
    .method-grid span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; }
    .method-grid strong { display: block; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11px; font-weight: 700; }
    .limitations { grid-column: 1 / -1; margin: 8px 0 0; padding: 18px 0 0; border-top: 1px solid #aeb3a8; color: #444a44; font-size: 11px; line-height: 1.75; }
    .limitations p { margin: 0 0 4px; }
    .site-footer { padding: 24px 0 0; color: var(--muted); font-size: 10px; }
    .footer-row { display: flex; justify-content: space-between; gap: 20px; }

    @media (max-width: 900px) {
      .shell { width: min(100% - 28px, 1390px); }
      .nav-links { display: none; }
      .score { grid-template-columns: 1fr; }
      .score-primary { min-height: 230px; border-right: 0; border-bottom: 1px solid var(--ink); }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .summary-item { border-bottom: 1px solid var(--line); }
      .summary-item:nth-child(2n) { border-right: 0; }
      .summary-item:last-child { grid-column: 1 / -1; border-bottom: 0; }
      .holding-grid { grid-template-columns: 1fr; }
      .method-inner { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .header-row { min-height: 58px; }
      .brand strong { font-size: 20px; }
      .brand span, .asof span { display: none; }
      .status-bar { display: block; margin-top: 16px; }
      .status-copy { display: block; margin-top: 5px; }
      .score-primary, .metric { padding: 20px; }
      .score-primary { min-height: 210px; }
      .score-grid { grid-template-columns: 1fr 1fr; }
      .metric { min-height: 105px; }
      .metric strong { font-size: 21px; }
      .section { padding-top: 34px; }
      .section-head { display: block; }
      .section-title { margin-bottom: 14px; }
      .hint { text-align: left; }
      .range-control { width: 100%; }
      .range-control button { flex: 1; }
      .chart-topline { align-items: flex-start; padding: 13px; }
      .legend { gap: 10px; }
      .chart-latest { display: none; }
      .chart-scroll { min-height: 320px; }
      .performance-chart { min-width: 760px; }
      .chart-foot { display: block; min-height: auto; padding: 10px 13px; }
      .chart-foot span { display: block; margin-top: 3px; }
      .holding-stats { grid-template-columns: 1fr 1fr; }
      .method-grid { grid-template-columns: 1fr; }
      .footer-row { display: block; }
      .footer-row span { display: block; margin-top: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .loading-line::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main id="app" class="loading-screen" aria-live="polite">
    <div class="loading-box">
      <strong>正在读取 V1 公开账本</strong>
      <span class="muted">核对每日净值、510300 基准和交易明细...</span>
      <div class="loading-line"></div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const query = new URLSearchParams(location.search);
      const state = {
        range: ['30', '90', 'all'].includes(query.get('range')) ? query.get('range') : 'all',
        data: null,
        chartRows: []
      };
      const CHART = { width: 1200, height: 410, left: 68, right: 28, top: 28, bottom: 46 };

      const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      const number = value => value == null || Number.isNaN(Number(value))
        ? '—' : new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 }).format(Number(value));
      const money = value => value == null || Number.isNaN(Number(value))
        ? '—' : new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY', maximumFractionDigits: 2 }).format(Number(value));
      const pct = value => {
        const parsed = Number(value);
        if (value == null || Number.isNaN(parsed)) return '—';
        const normalized = Object.is(parsed, -0) ? 0 : parsed;
        return `${normalized > 0 ? '+' : ''}${number(normalized)}%`;
      };
      const tone = value => Number(value) >= 0 ? 'positive' : 'negative';
      const sideClass = side => side === '买入' ? 'side-buy' : side === '卖出' ? 'side-sell' : 'side-dividend';
      const dateLabel = value => String(value || '').slice(5).replace('-', '/');

      function filterRows(rows) {
        if (state.range === 'all' || rows.length < 2) return rows;
        const days = Number(state.range);
        const latest = new Date(`${rows.at(-1).date}T00:00:00+08:00`).getTime();
        const cutoff = latest - days * 86400000;
        const filtered = rows.filter(row => new Date(`${row.date}T00:00:00+08:00`).getTime() >= cutoff);
        return filtered.length >= 2 ? filtered : rows.slice(-2);
      }

      function rangeControl() {
        return `<div class="range-control" role="group" aria-label="收益时间范围">
          <button data-range="30" class="${state.range === '30' ? 'active' : ''}" aria-pressed="${state.range === '30'}">30日</button>
          <button data-range="90" class="${state.range === '90' ? 'active' : ''}" aria-pressed="${state.range === '90'}">90日</button>
          <button data-range="all" class="${state.range === 'all' ? 'active' : ''}" aria-pressed="${state.range === 'all'}">全部</button>
        </div>`;
      }

      function chartSvg(data) {
        const rows = filterRows(data.series);
        state.chartRows = rows;
        const { width: W, height: H, left: L, right: R, top: T, bottom: B } = CHART;
        const values = rows.flatMap(row => [Number(row.strategy_return_pct), Number(row.benchmark_return_pct)]);
        let min = Math.min(0, ...values), max = Math.max(0, ...values);
        const span = Math.max(max - min, 1.2);
        min -= span * .18;
        max += span * .18;
        const x = index => L + (rows.length === 1 ? 0 : index / (rows.length - 1)) * (W - L - R);
        const y = value => T + (max - value) / (max - min) * (H - T - B);
        const grid = [];
        for (let i = 0; i < 5; i += 1) {
          const value = max - (max - min) * i / 4;
          const yy = y(value);
          grid.push(`<line x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}" stroke="#d7dad2" stroke-dasharray="4 6"/>
            <text x="${L - 10}" y="${yy + 4}" text-anchor="end" fill="#666c66" font-size="11">${value >= 0 ? '+' : ''}${value.toFixed(1)}%</text>`);
        }
        const zeroY = y(0);
        grid.push(`<line x1="${L}" y1="${zeroY}" x2="${W - R}" y2="${zeroY}" stroke="#151815" stroke-width="1.4"/>
          <text x="${L + 4}" y="${zeroY - 7}" text-anchor="start" fill="#444a44" font-size="10">0% 盈亏线</text>`);
        const strategyPath = rows.map((row, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)} ${y(Number(row.strategy_return_pct)).toFixed(1)}`).join(' ');
        const benchmarkPath = rows.map((row, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)} ${y(Number(row.benchmark_return_pct)).toFixed(1)}`).join(' ');
        const labelStep = Math.max(1, Math.ceil(rows.length / 6));
        const labels = rows.map((row, index) => index === 0 || index === rows.length - 1 || index % labelStep === 0
          ? `<text x="${x(index)}" y="${H - 15}" text-anchor="middle" fill="#666c66" font-size="10">${dateLabel(row.date)}</text>` : '').join('');
        const last = rows.at(-1);
        const lastX = x(rows.length - 1);
        const close = Math.abs(y(Number(last.strategy_return_pct)) - y(Number(last.benchmark_return_pct))) < 28;
        const strategyLabelY = y(Number(last.strategy_return_pct)) - (close ? 17 : 12);
        const benchmarkLabelY = y(Number(last.benchmark_return_pct)) + (close ? 24 : 19);
        return `<svg class="performance-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="V1 与 510300 沪深300 ETF 累计收益率曲线">
          ${grid.join('')}${labels}
          <path d="${strategyPath}" fill="none" stroke="#ee3022" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${benchmarkPath}" fill="none" stroke="#4a504a" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${lastX}" cy="${y(Number(last.strategy_return_pct))}" r="6" fill="#f4f4ef" stroke="#151815" stroke-width="3"/>
          <text x="${lastX - 10}" y="${strategyLabelY}" text-anchor="end" fill="#ee3022" font-size="12" font-weight="700">${pct(last.strategy_return_pct)}</text>
          <circle cx="${lastX}" cy="${y(Number(last.benchmark_return_pct))}" r="5" fill="#d9ff38" stroke="#151815" stroke-width="2.5"/>
          <text x="${lastX - 10}" y="${benchmarkLabelY}" text-anchor="end" fill="#343934" font-size="11">${pct(last.benchmark_return_pct)}</text>
          <rect class="chart-hit-area" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" tabindex="0" aria-label="移动指针查看每日收益"/>
        </svg>`;
      }

      function chartBlock(data) {
        return `<div class="chart-shell">
          <div class="chart-topline">
            <div class="legend">
              <div class="legend-item"><span class="legend-mark"></span>V1 前向模拟</div>
              <div class="legend-item"><span class="legend-mark benchmark"></span>510300 沪深300 ETF 含分红总回报</div>
            </div>
            <div class="chart-latest">LATEST ${escapeHtml(data.as_of)}</div>
          </div>
          <div class="chart-scroll">${chartSvg(data)}</div>
          <div class="chart-tooltip" role="status"></div>
          <div class="chart-foot">
            <span>同为 ${money(data.strategy.initial_capital)} 起始资金</span>
            <span>V1 与 ETF 均计模型交易费用</span>
            <span>ETF 现金分红复投</span>
          </div>
        </div>`;
      }

      function summaryStrip(data) {
        return `<div class="summary-strip">
          <div class="summary-item"><span>V1 累计收益</span><strong class="${tone(data.strategy.cumulative_return_pct)}">${pct(data.strategy.cumulative_return_pct)}</strong></div>
          <div class="summary-item"><span>510300 累计收益</span><strong class="${tone(data.benchmark.cumulative_return_pct)}">${pct(data.benchmark.cumulative_return_pct)}</strong></div>
          <div class="summary-item"><span>超额收益</span><strong class="${tone(data.excess_return_pct)}">${pct(data.excess_return_pct)}</strong></div>
          <div class="summary-item"><span>累计交易费用</span><strong>${money(data.strategy.fees)}</strong></div>
          <div class="summary-item"><span>日频最大回撤</span><strong class="negative">${pct(-Math.abs(Number(data.strategy.max_drawdown_pct)))}</strong></div>
        </div>`;
      }

      function holdings(data) {
        if (!data.holdings.length) {
          return `<div class="holding-item empty-holding"><h3>尚无模拟持仓</h3><p class="muted">首期信号与下一真实交易日执行完成后，这里会自动显示持仓成本、收盘价和浮动盈亏。</p></div>`;
        }
        return data.holdings.map(row => `<article class="holding-item">
          <div class="holding-head">
            <div><h3>${escapeHtml(row.name)}</h3><div class="holding-code">${escapeHtml(row.code)}</div></div>
            <div class="holding-pnl ${tone(row.unrealized_pnl)}">${money(row.unrealized_pnl)}<div class="holding-code">${pct(row.unrealized_return_pct)}</div></div>
          </div>
          <div class="holding-stats">
            <div><span>持仓股数</span><strong class="num">${number(row.shares)}</strong></div>
            <div><span>模型成本</span><strong class="num">${money(row.entry_price)}</strong></div>
            <div><span>最新收盘</span><strong class="num">${money(row.last_price)}</strong></div>
            <div><span>参考市值</span><strong class="num">${money(row.market_value)}</strong></div>
          </div>
          <div class="holding-code" style="margin-top:14px">价格日期 ${escapeHtml(row.price_date)}</div>
        </article>`).join('');
      }

      function transactions(data) {
        const rows = data.transactions.map(row => `<tr>
          <td class="mono">${escapeHtml(row.date)}</td>
          <td><span class="stock-name">${escapeHtml(row.name)}</span><span class="stock-code">${escapeHtml(row.code)}</span></td>
          <td><span class="side ${sideClass(row.side)}">${escapeHtml(row.side)}</span></td>
          <td class="right num">${number(row.shares)}</td>
          <td class="right num">${row.price == null ? '—' : money(row.price)}</td>
          <td class="right num">${money(row.gross)}</td>
          <td class="right num ${row.realized_pnl == null ? '' : tone(row.realized_pnl)}">${row.realized_pnl == null ? '待结算' : money(row.realized_pnl)}</td>
          <td class="right num">${money(row.fees)}</td>
          <td>${escapeHtml(row.reason)}</td>
        </tr>`).join('');
        return `<div class="trade-wrap"><table class="trade-table">
          <thead><tr><th>成交/除权日</th><th>股票</th><th>方向</th><th class="right">数量</th><th class="right">成交价</th><th class="right">成交额</th><th class="right">已实现盈亏</th><th class="right">费用</th><th>原因</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="9" class="empty-row">前向账本尚无交易；历史回测成交不会填充到模拟盘明细。</td></tr>'}</tbody>
        </table></div>`;
      }

      function render(data) {
        document.title = `V1 公开业绩 · ${data.as_of}`;
        app.className = '';
        app.innerHTML = `<div class="page">
          <header class="site-header"><div class="shell header-row">
            <a class="brand" href="#top" aria-label="返回页面顶部"><strong>V1 公开业绩</strong><span>PUBLIC PERFORMANCE LEDGER</span></a>
            <nav class="nav-links" aria-label="页面导航"><a href="#curve">收益曲线</a><a href="#holdings">当前持仓</a><a href="#transactions">交易明细</a><a href="#method">数据口径</a></nav>
            <div class="asof"><span>数据截至</span><strong>${escapeHtml(data.as_of)}</strong></div>
          </div></header>
          <div class="shell" id="top">
            <div class="status-bar"><strong>${escapeHtml(data.strategy.status)}</strong><span class="status-copy">每天收盘后自动更新 · 不连接券商 · 不自动下单</span></div>
            <section class="score" aria-labelledby="strategy-name">
              <div class="score-primary">
                <div><div class="eyebrow">STRATEGY / V1 / FORWARD</div><h1 id="strategy-name">月度高息动量</h1></div>
                <div><div class="hero-return ${tone(data.strategy.cumulative_return_pct)}">${pct(data.strategy.cumulative_return_pct)}</div><small>前向模拟累计收益 · 起始资金 ${money(data.strategy.initial_capital)}</small></div>
              </div>
              <div class="score-grid">
                <div class="metric"><span>累计盈亏总计</span><strong class="${tone(data.strategy.total_pnl)}">${money(data.strategy.total_pnl)}</strong></div>
                <div class="metric"><span>总资产</span><strong>${money(data.strategy.total_assets)}</strong></div>
                <div class="metric"><span>成交次数</span><strong class="num">${number(data.strategy.trade_count)} 笔</strong></div>
                <div class="metric"><span>当前持仓</span><strong class="num">${number(data.strategy.holdings_count)} / ${number(data.strategy.max_holdings)} 只</strong></div>
              </div>
            </section>

            <section class="section" id="curve"><div class="section-head">
              <div class="section-title"><span>01</span><h2>收益曲线</h2></div>${rangeControl()}
            </div>${chartBlock(data)}${summaryStrip(data)}</section>

            <section class="section" id="holdings"><div class="section-head">
              <div class="section-title"><span>02</span><h2>当前持仓</h2></div><span class="hint">模型持仓按每日未复权收盘价盯市，不读取你的真实账户</span>
            </div><div class="holding-grid">${holdings(data)}</div></section>

            <section class="section" id="transactions"><div class="section-head">
              <div class="section-title"><span>03</span><h2>交易明细</h2></div><span class="hint">累计 ${number(data.strategy.event_count)} 条账本事件，买卖费用单列</span>
            </div>${transactions(data)}</section>
          </div>

          <section class="method-band" id="method"><div class="shell method-inner">
            <h2>数据口径</h2>
            <div class="method-grid">
              <div><span>V1 冻结提交</span><strong>${escapeHtml(data.audit.v1_commit || '—')}</strong></div>
              <div><span>前向观察起点</span><strong>${escapeHtml(data.forward_start_date)}</strong></div>
              <div><span>价格口径</span><strong>${escapeHtml(data.audit.price_format || '—')}</strong></div>
              <div><span>基准方法</span><strong>${escapeHtml(data.benchmark.method)}</strong></div>
              <div><span>账本指纹</span><strong>${escapeHtml(data.audit.journal_sha256 || '—')}</strong></div>
              <div><span>业绩指纹</span><strong>${escapeHtml(data.audit.performance_sha256 || '—')}</strong></div>
              <div class="limitations">${data.limitations.map(item => `<p>· ${escapeHtml(item)}</p>`).join('')}</div>
            </div>
          </div></section>

          <footer class="site-footer"><div class="shell footer-row"><span>V1 PUBLIC PERFORMANCE · MODEL LEDGER</span><span>生成时间 ${escapeHtml(data.generated_at)}</span></div></footer>
        </div>`;
        bindInteractions();
      }

      function bindInteractions() {
        app.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => {
          state.range = button.dataset.range;
          const url = new URL(location.href);
          url.searchParams.set('range', state.range);
          history.replaceState({}, '', url);
          render(state.data);
        }));
        const svg = app.querySelector('.performance-chart');
        const hit = app.querySelector('.chart-hit-area');
        const tooltip = app.querySelector('.chart-tooltip');
        if (!svg || !hit || !tooltip || !state.chartRows.length) return;
        const showPoint = clientX => {
          const rect = svg.getBoundingClientRect();
          const shellRect = svg.closest('.chart-shell').getBoundingClientRect();
          const viewX = (clientX - rect.left) / rect.width * CHART.width;
          const usable = CHART.width - CHART.left - CHART.right;
          const ratio = Math.min(1, Math.max(0, (viewX - CHART.left) / usable));
          const index = Math.round(ratio * Math.max(state.chartRows.length - 1, 0));
          const row = state.chartRows[index];
          const left = Math.min(shellRect.width - 100, Math.max(100, clientX - shellRect.left));
          tooltip.style.left = `${left}px`;
          tooltip.innerHTML = `<strong>${escapeHtml(row.date)}</strong>
            <div class="tooltip-row"><span>V1</span><span class="strategy">${pct(row.strategy_return_pct)}</span></div>
            <div class="tooltip-row"><span>510300</span><span class="benchmark">${pct(row.benchmark_return_pct)}</span></div>
            <div class="tooltip-row"><span>V1 资产</span><span>${money(row.strategy_nav)}</span></div>`;
          tooltip.classList.add('visible');
        };
        hit.addEventListener('pointermove', event => showPoint(event.clientX));
        hit.addEventListener('pointerleave', () => tooltip.classList.remove('visible'));
        hit.addEventListener('focus', () => showPoint(svg.getBoundingClientRect().right - 20));
        hit.addEventListener('blur', () => tooltip.classList.remove('visible'));
      }

      function showError(error) {
        app.className = 'error-screen';
        app.innerHTML = `<div class="error-box"><h1>公开业绩暂时无法读取</h1><p class="muted">${escapeHtml(error.message || error)}</p><button class="retry-button" type="button">重新读取</button></div>`;
        app.querySelector('button').addEventListener('click', load);
      }

      async function load() {
        try {
          const response = await fetch(`./performance.json?v=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`performance.json 返回 HTTP ${response.status}`);
          const data = await response.json();
          if (data.schema_version !== 1 || !Array.isArray(data.series) || !data.series.length) {
            throw new Error('公开业绩数据格式不完整，已停止渲染');
          }
          state.data = data;
          render(data);
        } catch (error) {
          showError(error);
        }
      }

      load();
    })();
  </script>
</body>
</html>
