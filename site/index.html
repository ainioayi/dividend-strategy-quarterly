<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="沪深300全收益与万得二级债基的历史曲线及下穿点观察。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="chart.css">
  <script src="chart.js" defer></script>
  <title>股债交点</title>
</head>
<body>
  <header class="site-header">
    <div class="header-row wrap">
      <h1>股债交点</h1>
      <p class="data-date">数据截至：<time id="data-as-of">加载中</time></p>
    </div>
  </header>
  <main class="wrap">
    <aside class="real-warning" aria-label="数据质量提醒">
      <b>这是有数据质量限制的初步复算，不是万得官方精确复现。</b>
      <div id="quality-warnings"></div>
    </aside>
    <p id="load-status" class="load-status" role="status" aria-live="polite">正在加载历史曲线…</p>
    <button id="retry" class="retry-button" type="button" hidden>重新加载</button>
    <section id="real-frame" class="real-frame" aria-label="股债历史曲线" hidden>
      <div class="real-toolbar">
        <label for="real-signal">选择一个保留的下穿点
          <select id="real-signal"></select>
        </label>
        <button id="real-range" type="button" aria-pressed="false">放大信号前后</button>
      </div>
      <div class="real-legend" aria-label="图例">
        <span>沪深300全收益 · 官方</span>
        <span>万得二级债基 · 公开曲线重建</span>
        <span>原始下穿</span>
      </div>
      <svg id="real-chart" class="real-chart" viewBox="0 0 1000 350" role="img" aria-labelledby="real-chart-title real-chart-desc">
        <title id="real-chart-title">沪深300全收益与二级债基的历史曲线</title>
        <desc id="real-chart-desc">统一起点后叠图，红点标记股票线下穿债基线；债基缺失日期断线，不填补。</desc>
        <g id="real-grid"></g>
        <path id="real-stock" stroke="#245b45" stroke-width="1.9" fill="none" stroke-linejoin="round"></path>
        <path id="real-bond" stroke="#94714f" stroke-width="1.8" fill="none" stroke-linejoin="round"></path>
        <g id="real-points"></g>
        <g id="real-selection"></g>
      </svg>
      <p class="real-note" id="real-chart-period" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <p class="boundary-note">历史曲线仅供研究，不代表未来收益，也不构成买卖建议。</p>
    <noscript><p class="load-status">请开启 JavaScript，以加载真实数据和切换图表。</p></noscript>
  </main>
</body>
</html>
