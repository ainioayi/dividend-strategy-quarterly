<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="沪深300全收益与万得二级债基的历史曲线及下穿点观察。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="chart.css?v=20261114-freshness">
  <script src="chart.js?v=20261114-freshness" defer></script>
  <title>股债交点</title>
</head>
<body>
  <header class="site-header">
    <div class="header-row wrap">
      <h1>股债交点</h1>
      <div class="update-dates"><p class="data-date">行情截至：<time id="data-as-of">加载中</time></p><p class="checked-date">最近成功检查：<time id="data-checked-at">加载中</time>（北京时间）</p></div>
    </div>
  </header>
  <main class="wrap">
    <aside class="real-warning" aria-label="数据质量提醒">
      <b>第三方债基日期仍待核验，下穿不等于买入指令。</b>
      <details class="quality-details">
        <summary>查看数据限制与核验详情</summary>
        <div id="quality-warnings"></div>
      </details>
    </aside>
    <p id="source-dates" class="source-dates"></p>
    <p id="load-status" class="load-status" role="status" aria-live="polite">正在加载历史曲线…</p>
    <button id="retry" class="retry-button" type="button" hidden>重新加载</button>
    <section id="real-frame" class="real-frame" aria-label="股债历史曲线" hidden>
      <div class="real-toolbar">
        <label for="real-signal">选择原始下穿点 · 日期待核验
          <select id="real-signal"></select>
        </label>
        <button id="real-range" type="button" aria-pressed="false">放大信号前后</button>
      </div>
      <div class="real-legend" aria-label="图例">
        <span>沪深300全收益（分红再投入）</span>
        <span>万得二级债基（第三方公开曲线）</span>
        <span id="point-count">原始下穿 · 编号对应下方日期</span>
      </div>
      <div class="chart-context"><b>指数信号曲线，不是510300实际账户收益</b><p id="axis-explanation">0%＝共同起点；+100%＝翻倍；+400%＝原来的5倍。</p></div>
      <svg id="real-chart" class="real-chart" viewBox="0 0 1000 350" role="img" aria-labelledby="real-chart-title real-chart-desc">
        <title id="real-chart-title">两条指数自共同起点以来的累计收益</title>
        <desc id="real-chart-desc">红点编号对应下方全部下穿日期；原始日期待核验，不是买入指令。债基缺失日期断线，不填补。</desc>
      </svg>
      <p class="real-note" id="real-chart-period" role="status" aria-live="polite" aria-atomic="true"></p>
      <section class="date-index" aria-labelledby="date-index-title">
        <div class="date-heading"><h2 id="date-index-title">全部下穿日期</h2><span id="date-count"></span></div>
        <p class="index-help">点击任一日期，放大该点前后。编号与红点一一对应；这些是待核验的历史事件，不是买入建议。</p>
        <div id="dates"></div>
      </section>
    </section>
    <p class="boundary-note">历史曲线仅供研究，不代表未来收益，也不构成买卖建议。</p>
    <noscript><p class="load-status">请开启 JavaScript，以加载真实数据和切换图表。</p></noscript>
  </main>
</body>
</html>
