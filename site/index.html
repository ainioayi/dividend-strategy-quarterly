<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="高息动量 V1/V2/V3/V5 与多资产风险预算 V2.2 前向模拟公开业绩。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>策略公开业绩</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #fcfdfe;
      --surface-soft: #f8f9fb;
      --ink: #17191d;
      --muted: #626872;
      --subtle: #8b919b;
      --line: #dce0e5;
      --line-strong: #b9bfc8;
      --accent: #c7373f;
      --accent-soft: #faecee;
      --v2: #1d6fa5;
      --v3: #9a6a13;
      --v5: #6d4aa2;
      --ma-v22: #18785d;
      --negative: #16795a;
      --benchmark: #626a75;
      --chart-grid: #e3e6ea;
      --chart-zero: #aab0b9;
      --header: rgba(244, 246, 248, .94);
      --tooltip: #22262c;
      --tooltip-text: #f3f4f6;
      --shadow: 0 12px 32px rgba(32, 40, 52, .07);
      --radius: 6px;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111317;
        --surface: #191c21;
        --surface-soft: #1e2228;
        --ink: #eef0f3;
        --muted: #a4aab3;
        --subtle: #7e858f;
        --line: #30353c;
        --line-strong: #4a5059;
        --accent: #ee6a70;
        --accent-soft: #321f23;
        --v2: #67b7e8;
        --v3: #e7b557;
        --v5: #b997e8;
        --ma-v22: #55c7a0;
        --negative: #55c59d;
        --benchmark: #b3b9c2;
        --chart-grid: #30343a;
        --chart-zero: #5d636c;
        --header: rgba(17, 19, 23, .94);
        --tooltip: #eef0f3;
        --tooltip-text: #191c21;
        --shadow: 0 14px 36px rgba(2, 4, 8, .28);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    a { color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--mono); }
    .positive { color: var(--accent) !important; }
    .negative { color: var(--negative) !important; }
    .neutral { color: var(--ink) !important; }
    .muted { color: var(--muted); }

    .loading-screen, .error-screen { min-height: 100dvh; padding: 24px; }
    .loading-screen { display: block; }
    .loading-layout { width: min(1180px, 100%); margin: 0 auto; padding-top: 22px; }
    .loading-nav, .loading-panel, .loading-chart {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .loading-nav { height: 54px; }
    .loading-panel { height: 232px; margin-top: 28px; }
    .loading-chart { height: 330px; margin-top: 24px; }
    .skeleton-line { height: 100%; background: var(--surface-soft); }
    .error-screen { display: grid; place-items: center; }
    .error-box {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .error-box h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.25; }
    .retry-button {
      min-height: 42px;
      margin-top: 18px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      color: var(--surface);
      background: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }
    .retry-button:active, .range-control button:active { transform: translateY(1px); }
    .retry-button:focus-visible, .range-control button:focus-visible, .nav-links a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .page { min-height: 100dvh; padding-bottom: 34px; }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: var(--header);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .header-row { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; min-width: max-content; text-decoration: none; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: var(--radius);
      color: #f8f9fb;
      background: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
    }
    .brand-copy { display: grid; line-height: 1.15; }
    .brand-copy strong { font-size: 15px; font-weight: 760; }
    .brand-copy small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .nav-links { display: flex; align-items: center; gap: 26px; font-size: 12px; font-weight: 650; }
    .nav-links a { padding: 8px 0; text-decoration: none; }
    .nav-links a:hover { color: var(--accent); }
    .asof { padding-left: 20px; border-left: 1px solid var(--line); text-align: right; font-size: 10px; color: var(--muted); }
    .asof strong { display: block; margin-top: 1px; color: var(--ink); font-family: var(--mono); font-size: 11px; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 42px;
      margin: 24px 0 12px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 11px;
    }
    .status-bar strong { padding-left: 10px; border-left: 3px solid var(--accent); font-weight: 760; }
    .status-copy { color: var(--muted); }
    .status-bar.stale { border-color: var(--accent); background: var(--accent-soft); }
    .status-bar.stale .status-copy { color: var(--ink); font-weight: 650; }

    .strategy-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      margin: 12px 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
    }
    .strategy-tab {
      min-height: 58px;
      padding: 10px 16px;
      border: 0;
      color: var(--muted);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
    }
    .strategy-tab:hover { color: var(--ink); background: var(--surface-soft); }
    .strategy-tab.active { color: var(--ink); box-shadow: inset 0 -3px 0 var(--strategy-color); }
    .strategy-tab strong, .strategy-tab span { display: block; }
    .strategy-tab strong { font-size: 13px; }
    .strategy-tab span { margin-top: 3px; font-size: 10px; }
    .strategy-tab.v1 { --strategy-color: var(--accent); }
    .strategy-tab.v2 { --strategy-color: var(--v2); }
    .strategy-tab.v3 { --strategy-color: var(--v3); }
    .strategy-tab.v5 { --strategy-color: var(--v5); }
    .strategy-tab.ma_v22 { --strategy-color: var(--ma-v22); }

    .score {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1.38fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .score-primary {
      min-height: 230px;
      padding: 28px 30px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .score-primary h1 { margin: 0; font-size: clamp(28px, 3.5vw, 42px); line-height: 1.12; font-weight: 760; }
    .hero-return { margin-top: 20px; font-size: clamp(48px, 6vw, 70px); line-height: .95; font-weight: 720; }
    .score-primary small { display: block; margin-top: 12px; color: var(--muted); font-size: 11px; }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-soft); }
    .metric { min-height: 115px; padding: 24px 26px; border-bottom: 1px solid var(--line); }
    .metric:nth-child(odd) { border-right: 1px solid var(--line); }
    .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    .metric span { display: block; margin-bottom: 9px; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; font-weight: 720; }

    .section { padding: 46px 0 0; scroll-margin-top: 76px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 16px; }
    .section-title h2 { margin: 0; font-size: clamp(23px, 2.7vw, 30px); line-height: 1.15; font-weight: 740; }
    .hint { display: block; max-width: 640px; margin-top: 7px; color: var(--muted); font-size: 11px; }

    .range-control {
      display: inline-flex;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .range-control button {
      min-width: 62px;
      height: 36px;
      padding: 0 12px;
      border: 0;
      border-right: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .range-control button:last-child { border-right: 0; }
    .range-control button:hover { color: var(--ink); background: var(--surface-soft); }
    .range-control button.active { color: var(--surface); background: var(--ink); }

    .chart-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .chart-topline {
      min-height: 58px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
    }
    .legend { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; font-size: 11px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-item strong { margin-left: 3px; font-family: var(--mono); font-size: 11px; }
    .legend-mark { width: 20px; height: 3px; border-radius: 2px; background: var(--accent); }
    .legend-mark.v2 { background: var(--v2); }
    .legend-mark.v3 { background: var(--v3); }
    .legend-mark.v5 { background: var(--v5); }
    .legend-mark.ma_v22 { background: var(--ma-v22); }
    .legend-mark.benchmark { height: 2px; background: var(--benchmark); }
    .chart-latest { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .chart-scroll { min-height: 360px; overflow-x: auto; overflow-y: hidden; scrollbar-color: var(--line-strong) transparent; }
    .performance-chart { display: block; width: 100%; min-width: 760px; height: auto; }
    .chart-tooltip {
      position: absolute;
      z-index: 3;
      top: 72px;
      width: 188px;
      padding: 11px 12px;
      border-radius: var(--radius);
      color: var(--tooltip-text);
      background: var(--tooltip);
      box-shadow: var(--shadow);
      pointer-events: none;
      opacity: 0;
      transform: translateX(-50%);
      font-size: 11px;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip strong { display: block; margin-bottom: 7px; font-family: var(--mono); }
    .tooltip-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
    .tooltip-row .strategy { color: var(--accent); }
    .tooltip-row .v2 { color: var(--v2); }
    .tooltip-row .v3 { color: var(--v3); }
    .tooltip-row .v5 { color: var(--v5); }
    .tooltip-row .ma_v22 { color: var(--ma-v22); }
    .tooltip-row .benchmark { color: var(--benchmark); }
    .chart-foot { min-height: 42px; padding: 0 18px; display: flex; align-items: center; gap: 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      overflow: hidden;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .summary-item { min-height: 76px; padding: 15px 17px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-item span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 10px; }
    .summary-item strong { font-family: var(--mono); font-size: 14px; }

    .holding-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .holding-item { min-height: 150px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .holding-head { display: flex; justify-content: space-between; gap: 18px; }
    .holding-head h3 { margin: 0; font-size: 19px; }
    .holding-code { margin-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .holding-pnl { font-size: 17px; font-weight: 760; text-align: right; }
    .holding-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
    .holding-stats span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; }
    .holding-stats strong { display: block; font-size: 13px; }
    .empty-holding { grid-column: 1 / -1; min-height: 154px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(240px, .8fr); align-items: center; gap: 32px; }
    .empty-holding h3 { margin: 0 0 8px; font-size: 20px; }
    .empty-holding p { max-width: 620px; margin: 0; }
    .empty-flow { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-soft); }
    .empty-flow div { padding: 14px; }
    .empty-flow div + div { border-left: 1px solid var(--line); }
    .empty-flow span { display: block; color: var(--muted); font-size: 10px; }
    .empty-flow strong { display: block; margin-top: 5px; font-size: 12px; }

    .trade-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .trade-table { width: 100%; min-width: 1100px; border-collapse: collapse; font-size: 11px; }
    .trade-table th { padding: 13px 12px; background: var(--surface-soft); border-bottom: 1px solid var(--line-strong); color: var(--muted); font-size: 10px; text-align: left; white-space: nowrap; }
    .trade-table td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .trade-table tbody tr:last-child td { border-bottom: 0; }
    .trade-table tbody tr:hover { background: var(--surface-soft); }
    .trade-table .right { text-align: right; }
    .stock-name { display: block; font-weight: 700; }
    .stock-code { display: block; margin-top: 3px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .side { display: inline-flex; min-width: 42px; height: 24px; align-items: center; justify-content: center; border: 1px solid currentColor; border-radius: var(--radius); font-weight: 700; }
    .side-buy { color: var(--accent); }
    .side-sell { color: var(--negative); }
    .side-dividend { color: var(--benchmark); }
    .empty-row { padding: 42px !important; color: var(--muted); text-align: center !important; }

    .method-band { margin-top: 54px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-soft); }
    .method-inner { display: grid; grid-template-columns: .55fr 1.7fr; gap: 52px; padding: 34px 0; }
    .method-inner h2 { margin: 0; font-size: 24px; }
    .method-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 30px; }
    .method-grid div { min-width: 0; }
    .method-grid span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; }
    .method-grid strong { display: block; overflow-wrap: anywhere; font-family: var(--mono); font-size: 10px; font-weight: 650; }
    .limitations { grid-column: 1 / -1; margin: 4px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.7; }
    .limitations p { margin: 0 0 5px; }
    .site-footer { padding: 22px 0 0; color: var(--muted); font-size: 10px; }
    .footer-row { display: flex; justify-content: space-between; gap: 20px; }

    @media (max-width: 900px) {
      .shell { width: min(100% - 32px, 1180px); }
      .nav-links { display: none; }
      .strategy-tabs { grid-template-columns: repeat(5, minmax(160px, 1fr)); overflow-x: auto; }
      .score { grid-template-columns: 1fr; }
      .score-primary { min-height: 210px; border-right: 0; border-bottom: 1px solid var(--line); }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .summary-item { border-bottom: 1px solid var(--line); }
      .summary-item:nth-child(2n) { border-right: 0; }
      .summary-item:last-child { grid-column: 1 / -1; border-bottom: 0; }
      .holding-grid { grid-template-columns: 1fr; }
      .method-inner { grid-template-columns: 1fr; gap: 22px; }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 24px, 1180px); }
      .header-row { min-height: 58px; gap: 12px; }
      .brand-mark { width: 32px; height: 32px; }
      .brand-copy small, .asof span { display: none; }
      .asof { padding-left: 12px; }
      .status-bar { display: block; margin-top: 16px; padding: 10px 12px; }
      .status-copy { display: block; margin-top: 6px; padding-left: 13px; }
      .score-primary, .metric { padding: 20px; }
      .score-primary { min-height: 195px; }
      .score-grid { grid-template-columns: 1fr 1fr; }
      .metric { min-height: 100px; }
      .metric strong { font-size: 19px; overflow-wrap: anywhere; }
      .section { padding-top: 38px; }
      .section-head { display: block; }
      .section-title { margin-bottom: 14px; }
      .range-control { width: 100%; }
      .range-control button { flex: 1; }
      .chart-topline { min-height: auto; align-items: flex-start; padding: 13px; }
      .legend { display: grid; gap: 7px; }
      .chart-latest { display: none; }
      .chart-scroll { min-height: 300px; }
      .performance-chart { min-width: 680px; }
      .chart-foot { display: block; min-height: auto; padding: 10px 13px; }
      .chart-foot span { display: block; margin-top: 3px; }
      .holding-stats { grid-template-columns: 1fr 1fr; }
      .empty-holding { min-height: 190px; grid-template-columns: 1fr; gap: 20px; }
      .empty-row { padding: 28px 12px !important; text-align: left !important; }
      .method-grid { grid-template-columns: 1fr; }
      .footer-row { display: block; }
      .footer-row span { display: block; margin-top: 4px; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .site-header { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .nav-links a, .range-control button, .strategy-tab, .retry-button { transition: color .16s ease, background-color .16s ease, transform .16s ease; }
      .skeleton-line {
        background: linear-gradient(100deg, var(--surface-soft) 20%, var(--line) 44%, var(--surface-soft) 68%);
        background-size: 240% 100%;
        animation: skeleton 1.4s ease-in-out infinite;
      }
      @keyframes skeleton { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main id="app" class="loading-screen" aria-live="polite">
    <div class="loading-layout" aria-label="正在读取五策略公开账本">
      <div class="loading-nav"><div class="skeleton-line"></div></div>
      <div class="loading-panel"><div class="skeleton-line"></div></div>
      <div class="loading-chart"><div class="skeleton-line"></div></div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const query = new URLSearchParams(location.search);
      const state = {
        range: ['30', '90', 'all'].includes(query.get('range')) ? query.get('range') : 'all',
        strategy: ['v1', 'v2', 'v3', 'v5', 'ma_v22'].includes(query.get('strategy')) ? query.get('strategy') : 'v1',
        data: null,
        chartRows: []
      };
      const CHART = { width: 1200, height: 410, left: 68, right: 28, top: 28, bottom: 46 };

      const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      const number = value => value == null || Number.isNaN(Number(value))
        ? '--' : new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 }).format(Number(value));
      const money = value => value == null || Number.isNaN(Number(value))
        ? '--' : new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY', maximumFractionDigits: 2 }).format(Number(value));
      const pct = value => {
        const parsed = Number(value);
        if (value == null || Number.isNaN(parsed)) return '--';
        const normalized = Object.is(parsed, -0) ? 0 : parsed;
        return `${normalized > 0 ? '+' : ''}${number(normalized)}%`;
      };
      const tone = value => Number(value) > 0 ? 'positive' : Number(value) < 0 ? 'negative' : 'neutral';
      const sideClass = side => side === '买入' ? 'side-buy' : side === '卖出' ? 'side-sell' : 'side-dividend';
      const dateLabel = value => String(value || '').slice(5).replace('-', '/');
      const priceFormatLabel = value => value === 'unadjusted_close' ? '未复权收盘价' : String(value || '--');
      const strategyLabels = {
        v1: { name: '高息动量 V1（2只正式）', detail: '正式前向', color: 'var(--accent)' },
        v2: { name: '高息动量 V2（3只影子）', detail: '影子观察', color: 'var(--v2)' },
        v3: { name: '高息动量 V3（4只影子）', detail: '影子观察', color: 'var(--v3)' },
        v5: { name: '高息动量 V5（附件规则影子）', detail: '独立附件规则', color: 'var(--v5)' },
        ma_v22: { name: '多资产风险预算 V2.2（全球版影子）', detail: '四 ETF 风险预算', color: 'var(--ma-v22)' }
      };
      const strategyIds = Object.keys(strategyLabels);

      function strategyEntry(data, strategyId = state.strategy) {
        return data.strategies?.[strategyId];
      }

      function strategyTabs(data) {
        return `<div class="strategy-tabs" role="tablist" aria-label="查看策略独立账本">${strategyIds.map(id => {
          const entry = strategyEntry(data, id);
          const label = strategyLabels[id];
          const failed = entry.health?.outcome === 'failure' ? ' · 更新失败' : '';
          return `<button class="strategy-tab ${id} ${state.strategy === id ? 'active' : ''}" data-strategy="${id}" role="tab" aria-selected="${state.strategy === id}">
            <strong>${label.name}</strong><span>${label.detail} · ${pct(entry.summary.cumulative_return_pct)}${failed}</span>
          </button>`;
        }).join('')}</div>`;
      }

      function shanghaiToday() {
        const parts = Object.fromEntries(
          new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(new Date()).filter(part => part.type !== 'literal').map(part => [part.type, part.value])
        );
        return `${parts.year}-${parts.month}-${parts.day}`;
      }

      function businessDayLag(asOf, today = shanghaiToday()) {
        const start = new Date(`${asOf}T00:00:00Z`);
        const end = new Date(`${today}T00:00:00Z`);
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start >= end) return 0;
        let cursor = start;
        let count = 0;
        while (cursor < end && count <= 31) {
          cursor = new Date(cursor.getTime() + 86400000);
          const day = cursor.getUTCDay();
          if (day !== 0 && day !== 6) count += 1;
        }
        return count;
      }

      function freshnessState(data) {
        const lag = businessDayLag(data.as_of);
        return lag > 1
          ? { stale: true, message: `数据可能滞后：当前仍截至 ${data.as_of}，请检查自动更新告警。` }
          : { stale: false, message: '每日 18:30 更新，20:30 自动重试。仅模型模拟，不连接券商。' };
      }

      function capitalPolicyLabel(data) {
        const policy = data.audit?.capital_policy || {};
        const target = policy.target_allocation_pct ?? data.strategy.target_allocation_pct ?? 100;
        const reserve = policy.cash_reserve ?? data.strategy.cash_reserve ?? 0;
        return `目标投入 ${number(target)}%，现金保留 ${money(reserve)}`;
      }

      function filterRows(rows) {
        if (state.range === 'all' || rows.length < 2) return rows;
        const days = Number(state.range);
        const latest = new Date(`${rows.at(-1).date}T00:00:00+08:00`).getTime();
        const cutoff = latest - days * 86400000;
        const filtered = rows.filter(row => new Date(`${row.date}T00:00:00+08:00`).getTime() >= cutoff);
        return filtered.length >= 2 ? filtered : rows.slice(-2);
      }

      function rangeControl() {
        return `<div class="range-control" role="group" aria-label="收益时间范围">
          <button data-range="30" class="${state.range === '30' ? 'active' : ''}" aria-pressed="${state.range === '30'}">30日</button>
          <button data-range="90" class="${state.range === '90' ? 'active' : ''}" aria-pressed="${state.range === '90'}">90日</button>
          <button data-range="all" class="${state.range === 'all' ? 'active' : ''}" aria-pressed="${state.range === 'all'}">全部</button>
        </div>`;
      }

      function chartSvg(data) {
        const rows = filterRows(data.series);
        state.chartRows = rows;
        const { width: W, height: H, left: L, right: R, top: T, bottom: B } = CHART;
        const lines = [
          ...strategyIds.map(id => ({ id, key: `${id}_return_pct`, color: strategyLabels[id].color, width: id === 'v1' ? 3 : 2.5 })),
          { id: 'benchmark', key: 'benchmark_return_pct', color: 'var(--benchmark)', width: 2.2, dash: '7 6' }
        ];
        const values = rows.flatMap(row => lines.map(line => Number(row[line.key])));
        let min = Math.min(0, ...values), max = Math.max(0, ...values);
        const span = Math.max(max - min, 1.2);
        min -= span * .18;
        max += span * .18;
        const x = index => L + (rows.length === 1 ? 0 : index / (rows.length - 1)) * (W - L - R);
        const y = value => T + (max - value) / (max - min) * (H - T - B);
        const grid = [];
        for (let i = 0; i < 5; i += 1) {
          const value = max - (max - min) * i / 4;
          const yy = y(value);
          grid.push(`<line x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}" stroke="var(--chart-grid)" stroke-dasharray="4 6"/>
            <text x="${L - 10}" y="${yy + 4}" text-anchor="end" fill="var(--muted)" font-size="11">${value >= 0 ? '+' : ''}${value.toFixed(1)}%</text>`);
        }
        const zeroY = y(0);
        grid.push(`<line x1="${L}" y1="${zeroY}" x2="${W - R}" y2="${zeroY}" stroke="var(--chart-zero)" stroke-width="1.2"/>
          <text x="${L + 4}" y="${zeroY - 7}" text-anchor="start" fill="var(--muted)" font-size="10">0% 盈亏线</text>`);
        const labelStep = Math.max(1, Math.ceil(rows.length / 6));
        const labels = rows.map((row, index) => index === 0 || index === rows.length - 1 || index % labelStep === 0
          ? `<text x="${x(index)}" y="${H - 15}" text-anchor="middle" fill="var(--muted)" font-size="10">${dateLabel(row.date)}</text>` : '').join('');
        const last = rows.at(-1);
        const lastX = x(rows.length - 1);
        const paths = lines.map(line => {
          const path = rows.map((row, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)} ${y(Number(row[line.key])).toFixed(1)}`).join(' ');
          return `<path d="${path}" fill="none" stroke="${line.color}" stroke-width="${line.width}" ${line.dash ? `stroke-dasharray="${line.dash}"` : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
        }).join('');
        const points = lines.map(line => `<circle cx="${lastX}" cy="${y(Number(last[line.key]))}" r="4.5" fill="var(--surface)" stroke="${line.color}" stroke-width="2.5"/>`).join('');
        return `<svg class="performance-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="五策略与 510300 沪深300 ETF 累计收益率曲线">
          ${grid.join('')}${labels}
          ${paths}${points}
          <rect class="chart-hit-area" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" tabindex="0" aria-label="移动指针查看每日收益"/>
        </svg>`;
      }

      function chartBlock(data) {
        const benchmarkLabel = data.benchmark.inception_date
          ? '510300 沪深300 ETF'
          : '510300 沪深300 ETF（等待同步建仓）';
        const legend = strategyIds.map(id => {
          const entry = strategyEntry(data, id);
          return `<div class="legend-item"><span class="legend-mark ${id}"></span><span>${strategyLabels[id].name}</span><strong class="${tone(entry.summary.cumulative_return_pct)}">${pct(entry.summary.cumulative_return_pct)}</strong></div>`;
        }).join('');
        return `<div class="chart-shell">
          <div class="chart-topline">
            <div class="legend">
              ${legend}
              <div class="legend-item"><span class="legend-mark benchmark"></span><span>${escapeHtml(benchmarkLabel)}</span><strong>${pct(data.benchmark.cumulative_return_pct)}</strong></div>
            </div>
            <div class="chart-latest">数据截至 ${escapeHtml(data.as_of)}</div>
          </div>
          <div class="chart-scroll">${chartSvg(data)}</div>
          <div class="chart-tooltip" role="status"></div>
          <div class="chart-foot">
            <span>六组均以 ${money(data.strategy.initial_capital)} 起始</span>
            <span>五策略各自独立计费</span>
            <span>ETF 现金分红复投</span>
          </div>
        </div>`;
      }

      function summaryStrip(data) {
        const benchmarkLabel = data.benchmark.inception_date
          ? '510300 累计收益'
          : '510300 等待同步建仓';
        const selected = strategyEntry(data);
        return `<div class="summary-strip">
          ${strategyIds.map(id => {
            const value = strategyEntry(data, id).summary.cumulative_return_pct;
            return `<div class="summary-item"><span>${strategyLabels[id].name}累计收益</span><strong class="${tone(value)}">${pct(value)}</strong></div>`;
          }).join('')}
          <div class="summary-item"><span>${escapeHtml(benchmarkLabel)}</span><strong class="${tone(data.benchmark.cumulative_return_pct)}">${pct(data.benchmark.cumulative_return_pct)}</strong></div>
          <div class="summary-item"><span>${strategyLabels[state.strategy].name}日频最大回撤</span><strong class="${tone(-Math.abs(Number(selected.summary.max_drawdown_pct)))}">${pct(-Math.abs(Number(selected.summary.max_drawdown_pct)))}</strong></div>
        </div>`;
      }

      function holdings(data) {
        if (!data.holdings.length) {
          return `<div class="holding-item empty-holding">
            <div><h3>尚无模拟持仓</h3><p class="muted">首期信号执行后，这里会显示持仓成本、最新收盘价和浮动盈亏。</p></div>
            <div class="empty-flow" aria-label="前向模拟执行流程">
              <div><span>月末</span><strong>生成信号</strong></div>
              <div><span>下一交易日</span><strong>模拟执行</strong></div>
            </div>
          </div>`;
        }
        return data.holdings.map(row => `<article class="holding-item">
          <div class="holding-head">
            <div><h3>${escapeHtml(row.name)}</h3><div class="holding-code">${escapeHtml(row.code)}</div></div>
            <div class="holding-pnl ${tone(row.unrealized_pnl)}">${money(row.unrealized_pnl)}<div class="holding-code">${pct(row.unrealized_return_pct)}</div></div>
          </div>
          <div class="holding-stats">
            <div><span>持仓股数</span><strong class="num">${number(row.shares)}</strong></div>
            <div><span>模型成本</span><strong class="num">${money(row.entry_price)}</strong></div>
            <div><span>最新收盘</span><strong class="num">${money(row.last_price)}</strong></div>
            <div><span>参考市值</span><strong class="num">${money(row.market_value)}</strong></div>
          </div>
          <div class="holding-code" style="margin-top:14px">价格日期 ${escapeHtml(row.price_date)}</div>
        </article>`).join('');
      }

      function transactions(data) {
        const rows = data.transactions.map(row => `<tr>
          <td class="mono">${escapeHtml(row.date)}</td>
          <td><span class="stock-name">${escapeHtml(row.name)}</span><span class="stock-code">${escapeHtml(row.code)}</span></td>
          <td><span class="side ${sideClass(row.side)}">${escapeHtml(row.side)}</span></td>
          <td class="right num">${number(row.shares)}</td>
          <td class="right num">${row.price == null ? '--' : money(row.price)}</td>
          <td class="right num">${money(row.gross)}</td>
          <td class="right num ${row.realized_pnl == null ? '' : tone(row.realized_pnl)}">${row.realized_pnl == null ? '待结算' : money(row.realized_pnl)}</td>
          <td class="right num">${money(row.fees)}</td>
          <td>${escapeHtml(row.reason)}</td>
        </tr>`).join('');
        return `<div class="trade-wrap"><table class="trade-table">
          <thead><tr><th>成交/除权日</th><th>股票</th><th>方向</th><th class="right">数量</th><th class="right">成交价</th><th class="right">成交额</th><th class="right">已实现盈亏</th><th class="right">费用</th><th>原因</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="9" class="empty-row">前向账本尚无交易；历史回测成交不会填充到模拟盘明细。</td></tr>'}</tbody>
        </table></div>`;
      }

      function render(data) {
        const freshness = freshnessState(data);
        const selected = strategyEntry(data);
        const summary = selected.summary;
        const selectedLabel = strategyLabels[state.strategy];
        const failed = selected.health?.outcome === 'failure';
        document.title = `五策略公开业绩 · ${data.as_of}`;
        app.className = '';
        app.innerHTML = `<div class="page">
          <header class="site-header"><div class="shell header-row">
            <a class="brand" href="#top" aria-label="返回页面顶部"><span class="brand-mark">V</span><span class="brand-copy"><strong>公开业绩</strong><small>五策略独立模拟账本</small></span></a>
            <nav class="nav-links" aria-label="页面导航"><a href="#curve">收益曲线</a><a href="#holdings">当前持仓</a><a href="#transactions">交易明细</a><a href="#method">数据口径</a></nav>
            <div class="asof"><span>数据截至</span><strong>${escapeHtml(data.as_of)}</strong></div>
          </div></header>
          <div class="shell" id="top">
            <div class="status-bar ${freshness.stale || failed ? 'stale' : ''}"><strong>${escapeHtml(summary.status)}</strong><span class="status-copy">${escapeHtml(selected.health?.status || '正常')} · ${escapeHtml(freshness.message)}</span></div>
            ${strategyTabs(data)}
            <section class="score" aria-labelledby="strategy-name">
              <div class="score-primary">
                <div><div class="eyebrow">${state.strategy === 'v1' ? '正式前向模拟' : '影子前向观察'}</div><h1 id="strategy-name">${escapeHtml(summary.name)}</h1></div>
                <div><div class="hero-return ${tone(summary.cumulative_return_pct)}">${pct(summary.cumulative_return_pct)}</div><small>累计收益，独立起始资金 ${money(summary.initial_capital)}</small></div>
              </div>
              <div class="score-grid">
                <div class="metric"><span>累计盈亏总计</span><strong class="${tone(summary.total_pnl)}">${money(summary.total_pnl)}</strong></div>
                <div class="metric"><span>总资产</span><strong>${money(summary.total_assets)}</strong></div>
                <div class="metric"><span>成交次数</span><strong class="num">${number(summary.trade_count)} 笔</strong></div>
                <div class="metric"><span>当前持仓</span><strong class="num">${number(summary.holdings_count)} / ${number(summary.max_holdings)} 只</strong></div>
                <div class="metric"><span>现金余额</span><strong>${money(summary.cash)}</strong></div>
                <div class="metric"><span>累计费用</span><strong>${money(summary.fees)}</strong></div>
              </div>
            </section>

            <section class="section" id="curve"><div class="section-head">
              <div class="section-title"><h2>收益曲线</h2><span class="hint">五策略与 510300 沪深300 ETF 使用同一起点对比</span></div>${rangeControl()}
            </div>${chartBlock(data)}${summaryStrip(data)}</section>

            <section class="section" id="holdings"><div class="section-head">
              <div class="section-title"><h2>当前持仓</h2><span class="hint">按每日未复权收盘价盯市，不读取真实账户</span></div>
            </div><div class="holding-grid">${holdings(selected)}</div></section>

            <section class="section" id="transactions"><div class="section-head">
              <div class="section-title"><h2>交易明细</h2><span class="hint">${escapeHtml(selectedLabel.name)} 累计 ${number(summary.event_count)} 条账本事件，买卖费用单列</span></div>
            </div>${transactions(selected)}</section>
          </div>

          <section class="method-band" id="method"><div class="shell method-inner">
            <h2>数据口径</h2>
            <div class="method-grid">
              <div><span>V1 冻结提交</span><strong>${escapeHtml(data.audit.v1_commit || '--')}</strong></div>
              <div><span>前向观察起点</span><strong>${escapeHtml(data.forward_start_date)}</strong></div>
              <div><span>资金使用</span><strong>${escapeHtml(capitalPolicyLabel(data))}</strong></div>
              <div><span>价格口径</span><strong>${escapeHtml(priceFormatLabel(data.audit.price_format))}</strong></div>
              <div><span>基准方法</span><strong>${escapeHtml(data.benchmark.method)}</strong></div>
              <div><span>${escapeHtml(selectedLabel.name)}账本指纹</span><strong>${escapeHtml(selected.audit.journal_sha256 || '--')}</strong></div>
              <div><span>业绩指纹</span><strong>${escapeHtml(data.audit.performance_sha256 || '--')}</strong></div>
              <div class="limitations">${data.limitations.map(item => `<p>${escapeHtml(item)}</p>`).join('')}</div>
            </div>
          </div></section>

          <footer class="site-footer"><div class="shell footer-row"><span>高息动量 V1 正式 · 其余四策略影子公开业绩</span><span>生成时间 ${escapeHtml(data.generated_at)}</span></div></footer>
        </div>`;
        const tabs = document.querySelector('.strategy-tabs');
        const activeTab = tabs?.querySelector('.strategy-tab.active');
        if (tabs && activeTab) tabs.scrollLeft = Math.max(0, activeTab.offsetLeft + activeTab.offsetWidth - tabs.clientWidth);
        bindInteractions();
      }

      function bindInteractions() {
        app.querySelectorAll('[data-strategy]').forEach(button => button.addEventListener('click', () => {
          state.strategy = button.dataset.strategy;
          const url = new URL(location.href);
          url.searchParams.set('strategy', state.strategy);
          history.replaceState({}, '', url);
          render(state.data);
        }));
        app.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => {
          state.range = button.dataset.range;
          const url = new URL(location.href);
          url.searchParams.set('range', state.range);
          history.replaceState({}, '', url);
          render(state.data);
        }));
        const svg = app.querySelector('.performance-chart');
        const hit = app.querySelector('.chart-hit-area');
        const tooltip = app.querySelector('.chart-tooltip');
        if (!svg || !hit || !tooltip || !state.chartRows.length) return;
        const showPoint = clientX => {
          const rect = svg.getBoundingClientRect();
          const shellRect = svg.closest('.chart-shell').getBoundingClientRect();
          const viewX = (clientX - rect.left) / rect.width * CHART.width;
          const usable = CHART.width - CHART.left - CHART.right;
          const ratio = Math.min(1, Math.max(0, (viewX - CHART.left) / usable));
          const index = Math.round(ratio * Math.max(state.chartRows.length - 1, 0));
          const row = state.chartRows[index];
          const left = Math.min(shellRect.width - 100, Math.max(100, clientX - shellRect.left));
          tooltip.style.left = `${left}px`;
          tooltip.innerHTML = `<strong>${escapeHtml(row.date)}</strong>
            ${strategyIds.map(id => `<div class="tooltip-row"><span>${strategyLabels[id].name}</span><span class="${id === 'v1' ? 'strategy' : id}">${pct(row[`${id}_return_pct`])}</span></div>`).join('')}
            <div class="tooltip-row"><span>510300</span><span class="benchmark">${pct(row.benchmark_return_pct)}</span></div>
            <div class="tooltip-row"><span>${strategyLabels[state.strategy].name}资产</span><span>${money(row[`${state.strategy}_nav`])}</span></div>`;
          tooltip.classList.add('visible');
        };
        hit.addEventListener('pointermove', event => showPoint(event.clientX));
        hit.addEventListener('pointerleave', () => tooltip.classList.remove('visible'));
        hit.addEventListener('focus', () => showPoint(svg.getBoundingClientRect().right - 20));
        hit.addEventListener('blur', () => tooltip.classList.remove('visible'));
      }

      function showError(error) {
        app.className = 'error-screen';
        app.innerHTML = `<div class="error-box"><h1>公开业绩暂时无法读取</h1><p class="muted">${escapeHtml(error.message || error)}</p><button class="retry-button" type="button">重新读取</button></div>`;
        app.querySelector('button').addEventListener('click', load);
      }

      async function load() {
        try {
          const response = await fetch(`./performance.json?v=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`performance.json 返回 HTTP ${response.status}`);
          const data = await response.json();
          if (data.schema_version !== 4 || strategyIds.some(id => !data.strategies?.[id]) || !Array.isArray(data.series) || !data.series.length) {
            throw new Error('公开业绩数据格式不完整，已停止渲染');
          }
          state.data = data;
          render(data);
        } catch (error) {
          showError(error);
        }
      }

      load();
    })();
  </script>
</body>
</html>
