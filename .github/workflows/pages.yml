name: 股债交点自动更新与部署

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/chart.css"
      - "site/chart.js"
      - "site/stock-bond.json"
      - "config/stock_bond.json"
      - "scripts/stock_bond_page.py"
      - "tests/test_stock_bond_page.py"
      - "tests/test_pages_publication.py"
      - "data/stock-bond/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  schedule:
    # UTC 10:30、13:30 = 北京时间每天18:30、21:30，兼顾来源延迟发布。
    - cron: "30 10,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-bond-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 校验数据并部署图表
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装已有依赖
        run: python -m pip install -r requirements.txt

      - name: 自动获取最新已收盘数据
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; now=datetime.now(ZoneInfo("Asia/Shanghai")); print((now.date() if now.hour>=18 else now.date()-timedelta(days=1)).isoformat())')"
          python scripts/stock_bond_page.py --refresh --as-of "$as_of"

      - name: 按当前参数重算交点
        run: |
          python scripts/stock_bond_page.py

      - name: 验证日期、输入指纹和交点规则
        run: |
          python scripts/stock_bond_page.py --verify-only
          python -m pytest -q tests/test_stock_bond_page.py tests/test_forward_workflow.py tests/test_pages_publication.py
          python -m compileall -q scripts tests
          git diff --check

      - name: 保存通过校验的数据与参数结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/stock-bond site/stock-bond.json
          if ! git diff --cached --quiet; then
            git commit -m "更新股债交点数据与计算结果"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git fetch origin main
              git rebase origin/main
              # 参数可能随远端推进而变化，同步后必须重算再校验。
              python scripts/stock_bond_page.py
              python scripts/stock_bond_page.py --verify-only
              python -m pytest -q tests/test_stock_bond_page.py tests/test_forward_workflow.py tests/test_pages_publication.py
              git add -- data/stock-bond site/stock-bond.json
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
            done
            if [ "$pushed" != true ]; then
              echo "同步后仍无法推送，保留线上上次成功页面。"
              exit 1
            fi
          fi

      - name: 发布前核对主分支版本
        id: publish_revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main已更新，停止发布旧快照；保留线上页面，等待最新任务重算后发布。"
            exit 1
          fi

      - name: 只打包新图表页面
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock-bond-site"
          cp site/index.html site/chart.css site/chart.js site/stock-bond.json "$RUNNER_TEMP/stock-bond-site/"

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stock-bond-site

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
