name: 部署 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署静态站点
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查站点产物
        run: |
          test -s site/index.html
          test -s site/performance.json
          python -m json.tool site/performance.json >/dev/null

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 核验五策略发布完整性与观察评估
        run: |
          pip install -r requirements.txt
          python scripts/forward_performance.py --verify-only

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
