name: V1/V2/V3 前向观察与公开业绩

on:
  schedule:
    # 北京时间 18:30 首次运行，20:30 同日幂等重试；脚本仍核验真实交易日和当日收盘价。
    - cron: "30 10 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Asia/Shanghai 当前日期 YYYY-MM-DD；留空自动取当天"
        required: false
        type: string
      mode:
        description: "门禁模式；rehearsal 只做隔离预演，不读取未来行情或写正式账本"
        required: true
        default: auto
        type: choice
        options: [auto, signal, execute, rehearsal]

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-forward-v123
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验 V1 冻结与三策略全量资金合同
        run: |
          python scripts/verify_v1_freeze.py
          python scripts/monthly_forward.py verify
          python scripts/monthly_forward.py --strategy v2 verify
          python scripts/monthly_forward.py --strategy v3 verify

      - name: 隔离预演首期信号与执行链路
        run: python scripts/rehearse_forward_cycle.py --verify-live-calendar --output "$RUNNER_TEMP/v123-forward-rehearsal.json"

      - name: 计算北京时间截止日
        if: inputs.mode != 'rehearsal'
        id: date
        shell: pwsh
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          $today = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "Asia/Shanghai").ToString("yyyy-MM-dd")
          $asOf = if ([string]::IsNullOrWhiteSpace($env:INPUT_DATE)) { $today } else { $env:INPUT_DATE }
          if ($asOf -ne $today) { throw "显式日期必须等于 Asia/Shanghai 当前日期，禁止历史回写" }
          "as_of=$asOf" >> $env:GITHUB_OUTPUT

      - name: 先计算交易日门禁
        if: inputs.mode != 'rehearsal'
        id: plan
        shell: pwsh
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          $mode = if ([string]::IsNullOrWhiteSpace($env:INPUT_MODE)) { "auto" } else { $env:INPUT_MODE }
          $planPath = Join-Path $env:RUNNER_TEMP "forward-plan.json"
          python scripts/forward_daily.py `
            --date "${{ steps.date.outputs.as_of }}" `
            --mode $mode `
            --plan-only `
            --plan-json $planPath
          $plan = Get-Content -Raw -Encoding UTF8 $planPath | ConvertFrom-Json
          "action=$($plan.action)" >> $env:GITHUB_OUTPUT
          "reason=$($plan.reason)" >> $env:GITHUB_OUTPUT
          "is_trading_day=$($plan.is_trading_day.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: 刷新不复权行情与完整已实施分红
        if: steps.plan.outputs.action == 'signal' || steps.plan.outputs.action == 'execute'
        shell: pwsh
        run: |
          python scripts/refresh_backtest_cache.py `
            --as-of "${{ steps.date.outputs.as_of }}" `
            --cache-dir data/forward/cache `
            --source sina `
            --interval 1.05 `
            --dividend-interval 1.05

      - name: 重建版本化输入
        if: steps.plan.outputs.action == 'signal' || steps.plan.outputs.action == 'execute'
        shell: pwsh
        run: |
          python scripts/build_universe_manifest.py `
            --from-cache data/forward/cache `
            --as-of "${{ steps.date.outputs.as_of }}" `
            --top 0 `
            --min-years 0 `
            --pool-min-years 3 `
            --output data/forward/inputs/universe_manifest.json
          python scripts/build_rebalance_dates.py `
            --manifest data/forward/inputs/universe_manifest.json `
            --cache-dir data/forward/cache `
            --as-of "${{ steps.date.outputs.as_of }}" `
            --output data/forward/inputs/rebalance_dates_monthly.json

      - name: 更新 V1 正式前向账本
        id: v1
        if: steps.plan.outputs.action == 'signal' || steps.plan.outputs.action == 'execute'
        shell: pwsh
        run: |
          python scripts/forward_daily.py `
            --date "${{ steps.date.outputs.as_of }}" `
            --mode "${{ steps.plan.outputs.action }}"

      - name: 更新 V2 影子账本
        id: v2
        continue-on-error: true
        if: steps.plan.outputs.action == 'signal' || steps.plan.outputs.action == 'execute'
        shell: pwsh
        run: |
          python scripts/forward_daily.py `
            --strategy v2 `
            --date "${{ steps.date.outputs.as_of }}" `
            --mode "${{ steps.plan.outputs.action }}"

      - name: 更新 V3 影子账本
        id: v3
        continue-on-error: true
        if: steps.plan.outputs.action == 'signal' || steps.plan.outputs.action == 'execute'
        shell: pwsh
        run: |
          python scripts/forward_daily.py `
            --strategy v3 `
            --date "${{ steps.date.outputs.as_of }}" `
            --mode "${{ steps.plan.outputs.action }}"

      - name: 记录三策略独立健康状态
        if: steps.plan.outputs.action == 'signal' || steps.plan.outputs.action == 'execute'
        shell: pwsh
        env:
          V1_OUTCOME: ${{ steps.v1.outcome }}
          V2_OUTCOME: ${{ steps.v2.outcome }}
          V3_OUTCOME: ${{ steps.v3.outcome }}
        run: |
          python scripts/update_forward_health.py `
            --as-of "${{ steps.date.outputs.as_of }}" `
            --action "${{ steps.plan.outputs.action }}" `
            --v1 $env:V1_OUTCOME `
            --v2 $env:V2_OUTCOME `
            --v3 $env:V3_OUTCOME

      - name: 刷新每日公开业绩
        if: steps.plan.outputs.is_trading_day == 'true'
        shell: pwsh
        run: |
          python scripts/forward_performance.py `
            --as-of "${{ steps.date.outputs.as_of }}"

      - name: 验证前向模块
        if: steps.plan.outputs.is_trading_day == 'true'
        shell: pwsh
        run: |
          pytest -q tests/test_monthly_forward.py tests/test_forward_daily.py tests/test_forward_performance.py tests/test_rehearse_forward_cycle.py tests/test_refresh_backtest_cache.py tests/test_tradeable_benchmark.py
          python -m compileall -q scripts tests
          git diff --check

      - name: 提交输入、账本与公开业绩
        if: steps.plan.outputs.is_trading_day == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward site/performance.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "没有需要提交的前向业绩变化"
            exit 0
          }
          git commit -m "更新 V1/V2/V3 前向业绩 ${{ steps.date.outputs.as_of }}"
          git push

      - name: 影子账本失败时在发布后标记任务失败
        if: always() && (steps.v2.outcome == 'failure' || steps.v3.outcome == 'failure')
        run: |
          echo "V1 已独立处理；V2/V3 至少一个失败，公开页健康状态已保留失败证据。"
          exit 1

      - name: 记录月度门禁无动作原因
        if: steps.plan.outputs.action == 'noop'
        run: echo "月度账本不写入：${{ steps.plan.outputs.reason }}；真实交易日=${{ steps.plan.outputs.is_trading_day }}"

  report-health:
    name: 报告前向任务健康状态
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPDATE_RESULT: ${{ needs.update.result }}
      RUN_MODE: ${{ inputs.mode }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 创建失败告警或关闭已恢复告警
        shell: bash
        run: |
          set -euo pipefail
          title="[自动告警] V1 前向更新失败"
          issue_number="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[自动告警] V1 前向更新失败") | .number' \
              | head -n 1
          )"
          note="$RUNNER_TEMP/v1-forward-health.md"
          {
            echo "运行结果：$UPDATE_RESULT"
            echo
            echo "工作流：$RUN_URL"
            echo
            echo "UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          } > "$note"

          if [[ "$RUN_MODE" == "rehearsal" ]]; then
            echo "仅演练运行不创建或关闭正式更新告警"
            exit 0
          fi

          if [[ "$UPDATE_RESULT" == "failure" ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GH_REPO" --body-file "$note"
            else
              gh issue create --repo "$GH_REPO" --title "$title" --body-file "$note"
            fi
          elif [[ "$UPDATE_RESULT" == "success" && -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GH_REPO" --body "V1/V2/V3 前向更新已恢复：$RUN_URL"
            gh issue close "$issue_number" --repo "$GH_REPO" --reason completed
          fi
